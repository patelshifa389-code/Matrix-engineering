<div class="row" style="margin:0"><svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><path d="M12 6H6v34h6M34 6h6v34h-6" fill="none" stroke="currentColor" stroke-width="3"/><rect x="14" y="12" width="7" height="7" fill="#ffc857"/><rect x="25" y="12" width="7" height="7" fill="#2f7be5"/><rect x="14" y="24" width="7" height="7" fill="#8a4dff"/><rect x="25" y="24" width="7" height="7" fill="#1f8a70"/></svg><h1>Rank Rangers</h1></div><p class="sub">Operations Gym: 175 questions, from “what is a matrix?” to eigenvectors.</p>
<div class="bar" id="bar"></div><div id="v"></div></main>
<script>
(function(){
var E=1e-9,$=function(i){return document.getElementById(i)},S={xp:0,d:{}},cur=null;
try{var sv=JSON.parse(localStorage.getItem('rr2')||'null');if(sv){S=sv}}catch(e){}
function save(){try{localStorage.setItem('rr2',JSON.stringify(S))}catch(e){}}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ri(R,a,b){return a+Math.floor(R()*(b-a+1))}
function pick(R,a){return a[ri(R,0,a.length-1)]}
function fmt(x){if(Math.abs(x-Math.round(x))<E)return String(Math.round(x)).replace('-','\u2212');for(var d=2;d<=60;d++){var n=x*d;if(Math.abs(n-Math.round(n))<1e-7)return(n<0?'\u2212':'')+Math.abs(Math.round(n))+'/'+d}return x.toFixed(2)}
function cp(M){return M.map(function(r){return r.slice()})}
function T(M){return M[0].map(function(_,j){return M.map(function(r){return r[j]})})}
function nz(x){return Math.abs(x)>E}
function mat(M,o){o=o||{};var h='<table class="m">';if(o.h){h+='<tr><td class="h"></td>';M[0].forEach(function(_,j){h+='<td class="h">C'+(j+1)+'</td>'});h+='</tr>'}
M.forEach(function(r,i){h+='<tr>'+(o.h?'<td class="h">R'+(i+1)+'</td>':'');r.forEach(function(v,j){h+='<td'+(((o.sp&&j===o.sp?'sp ':'')+(o.hl?o.hl(i,j):''))?' class="'+((o.sp&&j===o.sp?'sp ':'')+(o.hl?o.hl(i,j):''))+'"':'')+'>'+fmt(v)+'</td>'});h+='</tr>'});return h+'</table>'}
function ms(M){return'['+M.map(function(r){return r.map(fmt).join(' ')}).join('; ')+']'}
function rankOf(M){var R=cp(M),r=0;for(var c=0;c<R[0].length&&r<R.length;c++){var p=-1;for(var i=r;i<R.length;i++)if(nz(R[i][c])){p=i;break}if(p<0)continue;var t=R[p];R[p]=R[r];R[r]=t;for(i=r+1;i<R.length;i++){var f=R[i][c]/R[r][c];for(var j=0;j<R[0].length;j++)R[i][j]-=f*R[r][j]}r++}return r}
function det(M){var n=M.length;if(n===1)return M[0][0];if(n===2)return M[0][0]*M[1][1]-M[0][1]*M[1][0];var d=0;for(var j=0;j<n;j++)d+=(j%2?-1:1)*M[0][j]*det(M.slice(1).map(function(r){return r.filter(function(_,k){return k!==j})}));return d}
function inv(M){var n=M.length,A=M.map(function(r,i){return r.concat(r.map(function(_,j){return i===j?1:0}))});for(var c=0;c<n;c++){var p=c;for(var i=c;i<n;i++)if(Math.abs(A[i][c])>Math.abs(A[p][c]))p=i;var t=A[p];A[p]=A[c];A[c]=t;var d=A[c][c];A[c]=A[c].map(function(v){return v/d});for(i=0;i<n;i++)if(i!==c){var f=A[i][c];A[i]=A[i].map(function(v,j){return v-f*A[c][j]})}}return A.map(function(r){return r.slice(n)})}
// ---- operations
function app(M,o){var R=cp(M),m=R.length,n=R[0].length,i;
if(o.c){for(i=0;i<m;i++){if(o.t==='s'){var t=R[i][o.a];R[i][o.a]=R[i][o.b];R[i][o.b]=t}else if(o.t==='k')R[i][o.a]*=o.k;else R[i][o.a]+=o.k*R[i][o.b]}}
else{if(o.t==='s'){var t2=R[o.a];R[o.a]=R[o.b];R[o.b]=t2}else if(o.t==='k')R[o.a]=R[o.a].map(function(v){return v*o.k});else R[o.a]=R[o.a].map(function(v,j){return v+o.k*R[o.b][j]})}return R}
function lab(o){var L=o.c?'C':'R',a=L+(o.a+1),b=L+(o.b+1),k=fmt(Math.abs(o.k||0));if(o.t==='s')return a+' \u2194 '+b;if(o.t==='k')return a+' \u2192 '+(fmt(o.k)==='1'?'':fmt(o.k)+'\u00b7')+a;return a+' \u2192 '+a+(o.k<0?' \u2212 ':' + ')+(k==='1'?'':k+'\u00b7')+b}
function hintNF(M){var m=M.length,n=M[0].length,k=0;
while(k<Math.min(m,n)){var ok=Math.abs(M[k][k]-1)<E;for(var i=0;i<m&&ok;i++)if(i!==k&&nz(M[i][k]))ok=false;for(var j=0;j<n&&ok;j++)if(j!==k&&nz(M[k][j]))ok=false;if(!ok)break;k++}
if(k>=Math.min(m,n))return null;var pi=-1,pj=-1,best=9;for(i=k;i<m;i++)for(j=k;j<n;j++)if(nz(M[i][j])){var s=Math.abs(Math.abs(M[i][j])-1)<E?0:1;if(s<best){best=s;pi=i;pj=j}}
if(pi<0)return null;if(pi!==k)return{t:'s',a:k,b:pi};if(pj!==k)return{t:'s',c:1,a:k,b:pj};
if(Math.abs(M[k][k]-1)>E)return{t:'k',a:k,k:1/M[k][k]};
for(i=0;i<m;i++)if(i!==k&&nz(M[i][k]))return{t:'a',a:i,b:k,k:-M[i][k]};
for(j=0;j<n;j++)if(j!==k&&nz(M[k][j]))return{t:'a',c:1,a:j,b:k,k:-M[k][j]};return null}
function hintGJ(M){var n=M.length;for(var c=0;c<n;c++){if(Math.abs(M[c][c])<E){for(var i=c+1;i<n;i++)if(nz(M[i][c]))return{t:'s',a:c,b:i}}
if(nz(M[c][c])&&Math.abs(M[c][c]-1)>E)return{t:'k',a:c,k:1/M[c][c]};for(i=0;i<n;i++)if(i!==c&&nz(M[i][c]))return{t:'a',a:i,b:c,k:-M[i][c]}}return null}
function par(M,h){var n=0,X=M;while(n<60){var o=h(X);if(!o)break;X=app(X,o);n++}return n}
function genM(L,R){var m,n;if(L<=20){m=2;n=2}else if(L<=40){var q=pick(R,[[2,3],[3,2],[3,3]]);m=q[0];n=q[1]}else if(L<=70){m=3;n=3}else if(L<=85){var q2=pick(R,[[3,4],[4,3]]);m=q2[0];n=q2[1]}else{var q3=pick(R,[[4,4],[3,4],[4,3]]);m=q3[0];n=q3[1]}
var mx=L<=20?2:L<=60?3:4,M,t=0;do{var rows=[];for(var i=0;i<m;i++){var r=[];for(var j=0;j<n;j++)r.push(ri(R,-mx,mx));rows.push(r)}M=rows;
if(L<=40&&L%3)M[0][0]=1;if(L>60)M[0][0]=0;if(L>40&&m>=3&&R()<.7){var x=pick(R,[1,2,-1]),y=pick(R,[1,-1]);M[m-1]=M[0].map(function(v,j){return x*v+y*M[1][j]})}
if(L>20&&L<=40&&R()<.4){M[m-1]=M[0].map(function(v){return v*2})}t++}while(rankOf(M)===0&&t<30);return M}
// ---- tracks
var IC={i:'📘',g:'⚙️',j:'🔁',h:'🧮',c:'⚖️',e:'🧭'};
var TR=[{k:'i',n:'Introduction to matrix',c:15,d:'Start here: order, entries, types, transpose, first row operation'},{k:'g',n:'Operations Gym: normal form',c:100,d:'Row and column ops to reach [Ir 0; 0 0], then read the rank'},
{k:'j',n:'Gauss-Jordan inverse',c:15,d:'Row operations on [A | I] until [I | A\u207b\u00b9]'},
{k:'h',n:'Inverse by Cayley-Hamilton',c:15,d:'Characteristic equation, then A\u207b\u00b9'},
{k:'c',n:'Consistency and solving',c:15,d:'Compare ranks, then solve'},
{k:'e',n:'Eigenvalues and eigenvectors',c:15,d:'Find \u03bb and the vector for the greatest \u03bb'}];
function bar(){var n=0;TR.forEach(function(t){for(var i=1;i<=t.c;i++)if(S.d[t.k+i])n++});$('bar').innerHTML='<span class="chip">'+S.xp+' XP</span><span class="chip">'+n+' / 175 cleared</span>'}
function home(){cur=null;bar();var h=ring()+'<div class="card"><h2>3-hour mastery plan</h2><p>15 min: Introduction (do it first). 40 min: Gym 1–40 (2×2 and 3×3). 55 min: Gym 41–100 (zero pivots, dependent rows, 4×4). 15 min each: Gauss-Jordan, Cayley-Hamilton, Consistency, Eigen. Match the par move count without hints for 3 stars.</p></div>';
TR.forEach(function(t,i){var d=0;for(var q=1;q<=t.c;q++)if(S.d[t.k+q])d++;h+='<button class="card tr" data-i="'+i+'"><span><b>'+IC[t.k]+' '+t.n+'</b><small>'+t.d+'</small></span><span>'+d+'/'+t.c+'</span></button>'});$('v').innerHTML=h;
Array.prototype.forEach.call(document.querySelectorAll('.tr'),function(b){b.onclick=function(){list(TR[+b.dataset.i])}})}
function list(t){cur=null;var h='<div class="row"><button id="bk">Back</button><b>'+t.n+'</b></div><div class="card"><div class="grid">';
for(var i=1;i<=t.c;i++){var s=S.d[t.k+i]||0;h+='<button class="'+(s?'s'+s:'')+'" data-n="'+i+'">'+i+'</button>'}$('v').innerHTML=h+'</div><p class="sub">Cleared levels are coloured. Stars: yellow 1\u20132, green 3.</p></div>';
$('bk').onclick=home;Array.prototype.forEach.call(document.querySelectorAll('.grid button'),function(b){b.onclick=function(){play(t,+b.dataset.n)}})}
function play(t,n){var R=rng(n*7919+t.k.charCodeAt(0)*131);if(t.k==='g'||t.k==='j')ops(t,n,R);else mcq(t,n,R)}
// ---- operations screen
function ops(t,n,R){var gj=t.k==='j',M0,M;
if(gj){var sz=n<=6?2:3,d;do{M0=[];for(var i=0;i<sz;i++){var r=[];for(var j=0;j<sz;j++)r.push(ri(R,-2,n<=10?3:4));M0.push(r)}d=Math.abs(det(M0))}while(d<1||d>(n<=3?1:3));M=M0.map(function(r,i){return r.concat(r.map(function(_,j){return i===j?1:0}))})}
else{M0=genM(n,R);M=cp(M0)}
var rk=gj?M0.length:rankOf(M0),H=gj?hintGJ:hintNF,P=par(M,H),G={M:M,st:[cp(M)],log:[],hint:0,t0:Date.now(),done:false};
function chk(X){if(gj){for(var i=0;i<X.length;i++)for(var j=0;j<X.length;j++)if(Math.abs(X[i][j]-(i===j?1:0))>1e-6)return false;return true}
for(i=0;i<X.length;i++)for(j=0;j<X[0].length;j++)if(Math.abs(X[i][j]-((i===j&&i<rk)?1:0))>1e-6)return false;return true}
var m=M.length,nc=gj?m:M[0].length;
function HL(X){return function(i,j){if(i===j&&Math.abs(X[i][j]-1)<1e-9&&i<(gj?m:rk))return'gd';var o=G.last;if(o&&(o.c?(j===o.a||(o.t==='s'&&j===o.b)):(i===o.a||(o.t==='s'&&i===o.b))))return'c-'+o.t;return''}}
function draw(){var X=G.st[G.st.length-1],h='<div class="row"><button id="bk">Back</button><b>'+t.n+' #'+n+'</b><span class="chip">Moves '+G.log.length+' (par '+P+')</span></div><div class="card"><p>'+(gj?'Row operations only: turn the left block into I. The right block becomes A\u207b\u00b9.':'Use row and column operations to reach normal form [Ir 0; 0 0].')+'</p><p class="log"><span class="t-s">Swap</span> &nbsp; <span class="t-k">Scale</span> &nbsp; <span class="t-a">Add multiple</span> &nbsp; Green = pivot done</p><div class="mats">'+mat(X,{h:!gj,sp:gj?m:0,hl:HL(X)})+'</div>';
if(!G.done){h+='<div class="row"><select id="ty" aria-label="Operation type"><option value="rs">Swap two rows</option><option value="rk">Multiply a row by k</option><option value="ra">Row: Ri \u2192 Ri + k\u00b7Rj</option>'+(gj?'':'<option value="cs">Swap two columns</option><option value="ck">Multiply a column by k</option><option value="ca">Column: Ci \u2192 Ci + k\u00b7Cj</option>')+'</select></div><div class="row"><select id="ia" aria-label="First index"></select><select id="ib" aria-label="Second index"></select><input id="kk" value="1" inputmode="text" aria-label="k, e.g. -2 or 1/3"></div><p><b id="pv"></b></p><div class="row"><button class="pri" id="ap">Apply</button><button id="un"'+(G.log.length?'':' disabled')+'>Undo</button><button id="hn">Hint</button><button id="rs">Reset</button></div>'+(G.msg?'<p class="log">'+G.msg+'</p>':'')}
else{var tm=Math.round((Date.now()-G.t0)/1000),st=G.hint?1:G.log.length<=P?3:G.log.length<=P+2?2:1;h+=conf()+'<div class="fb"><p class="big">'+'\u2605'.repeat(st)+'</p><p>Done in '+G.log.length+' moves (par '+P+'), '+tm+' s.'+(gj?'':' Rank = number of 1s = <b>'+rk+'</b>.')+'</p></div><div class="row">'+(n<t.c?'<button class="pri" id="nx">Next level</button>':'')+'<button id="rp">Replay</button></div>'}
h+='<details><summary>Your steps</summary><p class="log">'+(G.log.join('<br>')||'None yet')+'</p></details></div>';$('v').innerHTML=h;
$('bk').onclick=function(){list(t)};if(G.done){if($('nx'))$('nx').onclick=function(){play(t,n+1)};$('rp').onclick=function(){play(t,n)};return}
var ty=$('ty'),ia=$('ia'),ib=$('ib'),kk=$('kk');
function opts(el,cnt,L,sel){el.innerHTML='';for(var i=0;i<cnt;i++){var o=document.createElement('option');o.value=i;o.textContent=L+(i+1);if(i===sel)o.selected=true;el.appendChild(o)}}
function cur2(){var v=ty.value,c=v[0]==='c',kind=v[1];return{c:c,t:kind==='s'?'s':kind==='k'?'k':'a',a:+ia.value,b:+ib.value,k:parseKV(kk.value)}}
function ui(){var v=ty.value,c=v[0]==='c',cnt=c?nc:m,L=c?'C':'R',kind=v[1],pa=ia.value||0,pb=ib.value||(cnt>1?1:0);opts(ia,cnt,L,Math.min(+pa,cnt-1));opts(ib,cnt,L,Math.min(+pb,cnt-1));ib.style.display=kind==='k'?'none':'';kk.style.display=kind==='s'?'none':'';pv()}
function pv(){var o=cur2();$('pv').className='t-'+o.t;$('pv').textContent=isNaN(o.k)&&o.t!=='s'?'Enter k as a number or fraction':lab(o)}
ty.onchange=ui;ia.onchange=pv;ib.onchange=pv;kk.oninput=pv;ui();
$('ap').onclick=function(){var o=cur2();if(o.t!=='k'&&o.a===o.b&&o.t!=='k'){G.msg='Pick two different '+(o.c?'columns':'rows')+'.';return draw()}if(o.t!=='s'&&(isNaN(o.k)||(o.t==='k'&&!nz(o.k)))){G.msg=o.t==='k'?'k must be non-zero. Multiplying by 0 is not allowed.':'Enter a valid k.';return draw()}
G.msg='';var X=app(G.st[G.st.length-1],o);G.st.push(X);G.log.push('<span class="t-'+o.t+'">'+lab(o)+'</span>');G.last=o;if(chk(X)){G.done=true;var st=G.hint?1:G.log.length<=P?3:G.log.length<=P+2?2:1;if(st>(S.d[t.k+n]||0)){S.xp+=(st-(S.d[t.k+n]||0))*10;S.d[t.k+n]=st;save()}bar()}draw()};
$('un').onclick=function(){G.st.pop();G.log.pop();G.msg='';G.last=null;draw()};$('rs').onclick=function(){G.st=[cp(M)];G.log=[];G.msg='';G.last=null;draw()};
$('hn').onclick=function(){var o=H(G.st[G.st.length-1]);G.hint=1;G.msg=o?'Hint: '+lab(o):'Nothing left to do.';draw()}}
draw()}
function parseKV(s){s=String(s).trim().replace('\u2212','-');if(s.indexOf('/')>0){var p=s.split('/');return parseFloat(p[0])/parseFloat(p[1])}return parseFloat(s)}
